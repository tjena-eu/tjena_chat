server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Cross-origin isolation: required for SharedArrayBuffer in Firefox,
    # which vodozemac's WASM (compiled with atomics) depends on.
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    # Allow the Matrix homeserver and other cross-origin media to load
    # despite COEP require-corp (the homeserver must also send CORP headers;
    # see Synapse's content_security_policy / cors config).
    add_header Cross-Origin-Resource-Policy "cross-origin" always;

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
    }

    # Flutter web file names carry no version hash (main.dart.js, *.part.js,
    # flutter_bootstrap.js, assets/...): browsers and Cloudflare must check
    # for a newer copy on every load, or a deploy never reaches them.
    # Unchanged files are answered with a cheap 304.
    location ~* \.(js|mjs|css|png|jpg|jpeg|gif|ico|svg|wasm|json|html|otf|ttf|woff2?)$ {
        add_header Cache-Control "no-cache" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
    }
}
